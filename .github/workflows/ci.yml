name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the older run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # one Node version failing should not hide the others
      matrix:
        # The range the packages actually claim. `engines` says >=20 for the published
        # libraries; apps/collector needs >=22.18 for its dev script's native TypeScript
        # stripping, but its build and tests run fine on 20.
        node: ['20', '22', '24']

    steps:
      - uses: actions/checkout@v4

      # Reads the pinned version from the root package.json "packageManager" field.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      # --frozen-lockfile makes a stale lockfile a failure rather than a silent update.
      - run: pnpm install --frozen-lockfile

      # Builds every package in topological order, and type-checks the two Vite apps
      # (their build scripts run `tsc --noEmit` first). better-sqlite3 compiles here.
      - run: pnpm -r build

      - run: pnpm -r test
